name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      HEADLESS: 'true'
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Kakao-automation-test/package-lock.json

      - name: Install dependencies
        working-directory: Kakao-automation-test
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Kakao-automation-test
        run: npx playwright install --with-deps msedge

      # Allure report tự sinh khi chạy xong (src/reporters/allure-generate.reporter.ts) — reports/allure-report*/<runId>/
      - name: Run Playwright tests
        working-directory: Kakao-automation-test
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: Kakao-automation-test/reports/
          retention-days: 14
